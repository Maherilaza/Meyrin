name: Build Release

on:
  push:
    tags:
      - v*
    branches:
      - test-release/*

jobs:
  get-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.setver.outputs.version }}
    steps:
      - id: setver
        run: echo "version=${{ github.ref_name }}" >> $GITHUB_OUTPUT

  build:
    name: Build Rust Project
    runs-on: ubuntu-latest
    needs: get-version
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true

      - name: Build release
        run: cargo build --release

      - name: Prepare artifact
        run: |
          mkdir dist
          cp target/release/* dist/
          cd dist
          tar -caf rust-binary-${{ needs.get-version.outputs.version }}.tar.zst *

      - uses: actions/upload-artifact@v3
        with:
          name: build-artifact
          path: dist/rust-binary-${{ needs.get-version.outputs.version }}.tar.zst

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build, get-version]
    steps:
      - uses: actions/download-artifact@v3
        with:
          name: build-artifact
          path: dist/

      - name: Create Release and Upload Asset
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ needs.get-version.outputs.version }}
          name: Release ${{ needs.get-version.outputs.version }}
          files: dist/rust-binary-${{ needs.get-version.outputs.version }}.tar.zst
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
