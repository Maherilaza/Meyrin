name: Build Release if Dependabot Merged

on:
  push:
    branches:
      - main

jobs:
  build-release:
    runs-on: ubuntu-latest
    if: startsWith(github.head_commit.message, 'Merge pull request') && contains(github.head_commit.message, 'dependabot')
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install Rust
        uses: actions/setup-rust@v1
        with:
          rust-version: stable

      - name: Install cargo-release
        run: cargo install cargo-release

      - name: Bump version (patch) and create tag
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
          cargo release patch --no-publish --no-push
          git push origin main --follow-tags

      - name: Build project
        run: cargo build --release

      - name: Package release
        run: |
          mkdir -p release
          cp target/release/meyrin release/
          tar -czvf release.tar.gz release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
