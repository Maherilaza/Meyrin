[package]
name = "meyrin"
version = "0.1.0"
edition = "2021"

[dependencies]
clap = { version = "4.5.30", features = ["derive", "string"] }
colored = "3.0.0"
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.138"

[profile.release]
opt-level = 3       
lto = "fat"  
codegen-units = 1 
strip = true