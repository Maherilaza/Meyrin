[package]
name = "meyrin"
version = "0.1.0"
edition = "2021"

[dependencies]
actix-files = "0.6.6"
actix-web = "4"
clap = { version = "4.5.37", features = ["derive", "string"] }
colored = "3.0.0"
env_logger = "0.11.6"
log = "0.4.27"
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.138"
tera = "1.20.0"

[profile.release]
opt-level = 3       
lto = "fat"  
codegen-units = 1 
strip = true
debug = false
panic = "abort"
